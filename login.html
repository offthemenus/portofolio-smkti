<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Login — Rifky</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <div class="shape shape-yellow" aria-hidden="true"></div>
    <div class="shape shape-pink" aria-hidden="true"></div>
    <div class="decoration star" aria-hidden="true">
      <i class="ph ph-star-four"></i>
    </div>
    <div class="decoration sparkle" aria-hidden="true">
      <i class="ph ph-sparkle"></i>
    </div>

    <main class="login-container">
      <section class="login-card" aria-labelledby="login-title">
        <div class="logo">
          <div class="logo-icon">
            <i class="ph ph-star-four" aria-hidden="true"></i>
          </div>
          <div class="logo-text">Rifky<span>WEB APPLICATION</span></div>
        </div>

        <div class="welcome">Welcome back!</div>
        <h1 id="login-title">Login</h1>
        <p class="description">Masuk ke akun kamu untuk melanjutkan.</p>

        <form action="scripts/login.php" method="post">
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrapper">
              <i class="ph ph-envelope input-icon" aria-hidden="true"></i>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="nama@email.com"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <i class="ph ph-lock input-icon" aria-hidden="true"></i>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Masukkan password"
                autocomplete="current-password"
                required
              />
            </div>
          </div>

          <button class="login-button" type="submit">
            Login <i class="ph ph-arrow-right" aria-hidden="true"></i>
          </button>
        </form>
      </section>
    </main>

    <div class="toast" id="toast" role="alert" aria-live="polite" hidden>
      <i class="ph ph-warning-circle" aria-hidden="true"></i>
      <span>Email atau password salah.</span>
    </div>

    <script src="login.js" defer></script>
  </body>
</html>
